server:
  base_url_prod: "https://lite.ispilo.co.ke/api/v1"
  base_url_local: "http://localhost:8001/api/v1"
  port: 8001

database:
  postgres_writer:
    host: "${DB_WRITER_HOST}"
    port: 5432
    user: "${DB_WRITER_USER}"
    password: "${DB_WRITER_PASSWORD}"
    dbname: "${DB_NAME}"
  postgres_reader:
    host: "${DB_READER_HOST}"
    port: 5432
    user: "${DB_READER_USER}"
    password: "${DB_READER_PASSWORD}"
    dbname: "${DB_NAME}"
  redis:
    host: "${REDIS_HOST}"
    port: 6379

# Runtime secrets and endpoints are supplied through environment variables
# (see .env.example). This file only carries the database topology used by
# pkg/database; it must not contain credentials or signing keys.
