# Alertmanager configuration for Ispilolite.
#
# The default receiver intentionally has no integrations: alerts are visible in
# the Alertmanager UI (http://127.0.0.1:9093) but are not delivered anywhere
# until you add one. Uncomment and configure at least one of the examples
# below before relying on paging.

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

inhibit_rules:
  # A dead API makes every scrape-derived API/database alert noisy.
  - source_matchers:
      - alertname="IspiloliteAPIDown"
    target_matchers:
      - alertname=~"Ispilolite(Postgres|DB|High|Latency|Auth).*"
    equal: []

receivers:
  - name: default
