# Prometheus alert rules for Ispilolite.
#
# Metric names come from pkg/monitoring/prometheus.go and
# internal/search/metrics.go. Keep rules in sync when metrics are renamed.

groups:
  - name: ispilolite-availability
    rules:
      - alert: IspiloliteAPIDown
        expr: up{job="ispilolite-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "Ispilolite API is not scrapable"
          description: "Prometheus has failed to scrape the API for more than 2 minutes. Check the process, container health, and the Nginx upstream."

      - alert: IspiloliteNotificationWorkerDown
        expr: up{job="notification-worker"} == 0
        for: 10m
        labels:
          severity: warning
          service: notification
        annotations:
          summary: "Notification worker is not scrapable"
          description: "SMS and push events may be queuing without delivery. Check the worker and RabbitMQ consumers."

  - name: ispilolite-postgres
    rules:
      - alert: IspilolitePostgresPoolDown
        expr: ispilo_postgres_up == 0
        for: 2m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "PostgreSQL pool {{ $labels.pool }} is down"
          description: "The {{ $labels.pool }} connection pool cannot reach PostgreSQL."

      - alert: IspilolitePostgresReplicaLagHigh
        expr: max(ispilo_postgres_replication_lag_seconds{pool="reader"}) > 60
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Read replica lag is above 60 seconds"
          description: "Readers may serve stale data. Current lag: {{ $value }}s."

      - alert: IspilolitePostgresReplicaLagCritical
        expr: max(ispilo_postgres_replication_lag_seconds{pool="reader"}) > 300
        for: 5m
        labels:
          severity: critical
          service: postgres
        annotations:
          summary: "Read replica lag is above 5 minutes"
          description: "Stale reads are likely. Investigate replication and network health. Current lag: {{ $value }}s."

      - alert: IspilolitePostgresWaitingLocks
        expr: max(ispilo_postgres_waiting_locks) > 5
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Sessions are waiting on PostgreSQL locks"
          description: "{{ $value }} sessions have been waiting on locks for 5 minutes. Look for long transactions."

      - alert: IspilolitePostgresSlowQueries
        expr: max(ispilo_postgres_slow_queries) > 0
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "PostgreSQL has queries running longer than 5 minutes"
          description: "{{ $value }} long-running queries are active. Check pg_stat_activity for blockers."

      - alert: IspiloliteDBConnectionSaturation
        expr: |
          (
            max by (pool) (ispilo_db_in_use_connections)
            /
            clamp_min(max by (pool) (ispilo_db_open_connections), 1)
          ) > 0.9
        for: 10m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "Database connection pool {{ $labels.pool }} is saturated"
          description: "More than 90% of {{ $labels.pool }} connections are in use. Requests may start waiting."

  - name: ispilolite-http
    rules:
      - alert: IspiloliteHighErrorRate
        expr: |
          (
            sum(rate(ispilo_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(ispilo_http_requests_total[5m]))
          ) > 0.05
          and
          sum(rate(ispilo_http_requests_total[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API 5xx rate is above 5%"
          description: "More than 5% of requests have failed with 5xx for 5 minutes while traffic is non-trivial."

      - alert: IspiloliteLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(ispilo_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "API p95 latency is above 2 seconds"
          description: "p95 latency has exceeded 2s for 10 minutes. Check PostgreSQL, Elasticsearch, and external providers."

      - alert: IspiloliteLatencyP99Critical
        expr: histogram_quantile(0.99, sum by (le) (rate(ispilo_http_request_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: critical
          service: api
        annotations:
          summary: "API p99 latency is above 5 seconds"
          description: "p99 latency has exceeded 5s for 5 minutes."

      - alert: IspiloliteAuthAbuseSpike
        expr: sum(rate(ispilo_http_requests_total{route=~"/api/v1/auth/.*",status=~"401|403|429"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: api
        annotations:
          summary: "Spike in rejected authentication requests"
          description: "More than 1 rejected auth request per second for 5 minutes. Possible credential stuffing or OTP abuse."

  - name: ispilolite-queue
    rules:
      - alert: IspiloliteQueueBacklog
        expr: max by (queue) (ispilo_rabbitmq_queue_depth) > 1000
        for: 10m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "Queue {{ $labels.queue }} has a backlog"
          description: "More than 1000 ready messages for 10 minutes. Check consumer health and throughput."

      - alert: IspiloliteQueueBacklogCritical
        expr: max by (queue) (ispilo_rabbitmq_queue_depth) > 5000
        for: 10m
        labels:
          severity: critical
          service: rabbitmq
        annotations:
          summary: "Queue {{ $labels.queue }} backlog is critical"
          description: "More than 5000 ready messages for 10 minutes. Delivery or notifications are likely delayed."

      - alert: IspiloliteQueueConsumeErrors
        expr: sum by (queue) (rate(ispilo_rabbitmq_consumed_total{result=~"error|invalid"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "Queue {{ $labels.queue }} is rejecting messages"
          description: "Consumers are returning error or invalid for more than 0.1 messages/second. Inspect the DLQ."

      - alert: IspiloliteQueuePublishErrors
        expr: sum(rate(ispilo_rabbitmq_published_total{result=~"error|nack"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: rabbitmq
        annotations:
          summary: "RabbitMQ publish failures"
          description: "Events are failing to publish for 5 minutes. Async notifications and matching may be lost."

  - name: ispilolite-search
    rules:
      - alert: IspiloliteSearchFallbackRate
        expr: |
          (
            sum(rate(ispilo_search_fallbacks_total[10m]))
            /
            clamp_min(sum(rate(ispilo_search_queries_total[10m])), 0.001)
          ) > 0.25
          and
          sum(rate(ispilo_search_queries_total[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: search
        annotations:
          summary: "More than 25% of searches are falling back to PostgreSQL"
          description: "Elasticsearch is degraded or slow. Search latency and database load will increase."

      - alert: IspiloliteSearchBreakerOpen
        expr: max by (endpoint) (ispilo_search_breaker_state) >= 2
        for: 5m
        labels:
          severity: warning
          service: search
        annotations:
          summary: "Search circuit breaker is open for {{ $labels.endpoint }}"
          description: "The Elasticsearch fast path has been failing for 5 minutes; requests are served from PostgreSQL."

  - name: ispilolite-backup
    rules:
      - alert: IspiloliteBackupNeverObserved
        expr: absent(ispilo_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "No successful database backup has ever been observed"
          description: "Check the backup timer, node-exporter textfile directory, and permissions."
      # Requires scripts/backup-postgres.sh to write its metrics file into a
      # node_exporter textfile collector directory.
      - alert: IspiloliteBackupStale
        expr: time() - max(ispilo_backup_last_success_timestamp_seconds) > 93600
        for: 15m
        labels:
          severity: critical
          service: backup
        annotations:
          summary: "No successful database backup in over 26 hours"
          description: "The last recorded backup is older than 26 hours. Check the backup timer and offsite upload."
