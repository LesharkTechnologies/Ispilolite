name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules are tidy
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  docker-build:
    name: Container image (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [auth, migrate, notification]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            TARGET=${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  migration-smoke:
    name: Fresh PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ispilo
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: ispilolite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ispilo -d ispilolite"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgres://ispilo:test-password@127.0.0.1:5432/ispilolite?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: ci-migration-test-secret
      SKIP_MIGRATIONS: "true"
      CONFIG_PATH: config/config.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply and verify migrations on empty database
        run: go run ./cmd/migrate
      - name: Confirm idempotent rerun
        run: go run ./cmd/migrate
      - name: Verify registration, search, company links, and cross-role follows
        env:
          TEST_DATABASE_URL: postgres://ispilo:test-password@127.0.0.1:5432/ispilolite?sslmode=disable
        run: go test ./integration -count=1

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  static-analysis:
    name: gosec (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory until existing findings are triaged: G704 (possible SSRF),
    # G703 (path traversal), G201/G202 (dynamic SQL) and the SHA-1 Cloudinary
    # signature need human review rather than silent exclusion. Findings stay
    # visible in every run; remove continue-on-error once triage is complete.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -no-fail ./...
